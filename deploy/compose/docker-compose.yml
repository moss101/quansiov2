name: quansio-qual

services:
  postgres:
    image: postgres:17-alpine
    container_name: quansio-qual-postgres
    environment:
      POSTGRES_USER: quansio_admin
      POSTGRES_PASSWORD: ${QUAL_PG_ADMIN_PASSWORD}
      QUAL_PG_APP_PASSWORD: ${QUAL_PG_APP_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quansio_admin -d quansio_platform"]
      interval: 2s
      timeout: 3s
      retries: 60

  redis:
    image: redis:8-alpine
    container_name: quansio-qual-redis
    command: ["redis-server", "--requirepass", "${QUAL_REDIS_PASSWORD}", "--appendonly", "yes"]
    environment:
      REDIS_PASSWORD: ${QUAL_REDIS_PASSWORD}
    ports:
      - "54330:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 2s
      timeout: 3s
      retries: 60

  minio:
    image: quay.io/minio/minio:latest
    container_name: quansio-qual-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: quansio_qual_admin
      MINIO_ROOT_PASSWORD: ${QUAL_MINIO_PASSWORD}
    ports:
      - "54331:9000"
      - "54332:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 60

volumes:
  pgdata:
