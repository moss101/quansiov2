<!doctype html>
<!-- Quansio V9 mobile attention client (UX-007): attention and continuation
     only. Machine/effect administration surfaces are intentionally absent;
     notifications come from quansio-notify receipts and approvals from
     quansio-control. No local task-state mutation exists. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Quansio Attention</title>
<link rel="manifest" href="manifest.webmanifest" />
<style>
  :root { font-family: system-ui, sans-serif; }
  body { margin: 0; background: #0f1420; color: #e8ecf4; }
  header { padding: 14px 16px; background: #171e2e; font-weight: 600; }
  main { padding: 12px 16px 32px; }
  .card { background: #171e2e; border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .card h2 { margin: 0 0 8px; font-size: 14px; color: #93a0b4; }
  .item { padding: 8px 10px; border-radius: 8px; background: #0f1420; margin-bottom: 8px; font-size: 13px; }
  .item .state { float: right; color: #5b9dff; }
  button { background: #5b9dff; border: 0; color: #0f1420; font-weight: 600;
           padding: 8px 14px; border-radius: 8px; }
  button.deny { background: #ff6b6b; }
  input { width: 100%; box-sizing: border-box; padding: 8px; margin-bottom: 8px;
          border-radius: 8px; border: 1px solid #2a3550; background: #0f1420; color: #e8ecf4; }
  #status { font-size: 12px; color: #93a0b4; min-height: 16px; }
</style>
</head>
<body>
<header>Quansio — attention</header>
<main>
  <div class="card">
    <h2>Session</h2>
    <input id="api" placeholder="API base URL" />
    <input id="token" placeholder="bearer token" />
    <button id="load">Load attention</button>
    <p id="status"></p>
  </div>

  <div class="card">
    <h2>Notifications</h2>
    <div id="notifications"><div class="item">sign in to load receipts</div></div>
  </div>

  <div class="card">
    <h2>Approvals</h2>
    <input id="approval-id" placeholder="approval id" />
    <button id="approve">Approve</button>
    <button class="deny" id="deny">Deny</button>
  </div>
</main>

<script>
"use strict";
// Mobile surfaces are gated: task status, notifications, approvals,
// questions, handoff and takeover are supported; machine control and direct
// effect administration are not reachable from this client at all.
const SUPPORTED = new Set(["task_status", "notifications", "approvals", "questions", "handoff", "takeover"]);
if (!SUPPORTED.has("notifications")) throw new Error("attention surfaces misconfigured");

function base() { return document.getElementById("api").value.replace(/\/$/, ""); }
function token() { return document.getElementById("token").value.trim(); }
function note(text) { document.getElementById("status").textContent = text; }

async function whoami() {
  const response = await fetch(`${base()}/v9/identity`, { headers: { Authorization: `Bearer ${token()}` } });
  if (!response.ok) throw new Error(`identity refused (${response.status})`);
  return (await response.json()).identity;
}

async function loadNotifications(userId) {
  const response = await fetch(
    `${base().replace(/:\d+$/, ":8089")}/v9/notifications?recipient_id=${encodeURIComponent(userId)}`,
    { headers: { Authorization: `Bearer ${token()}` } },
  );
  if (!response.ok) throw new Error(`notifications refused (${response.status})`);
  const body = await response.json();
  const host = document.getElementById("notifications");
  host.innerHTML = "";
  if (!body.notifications.length) {
    host.innerHTML = '<div class="item">nothing needs attention</div>';
    return;
  }
  for (const notification of body.notifications) {
    const div = document.createElement("div");
    div.className = "item";
    div.innerHTML = `<span class="state">${notification.state}</span>${notification.urgency}: ${JSON.stringify(notification.payload)}`;
    host.appendChild(div);
  }
}

async function decide(approved) {
  const approvalId = document.getElementById("approval-id").value.trim();
  if (!approvalId) { note("approval id required"); return; }
  try {
    const identity = await whoami();
    const control = base().replace(/:\d+$/, ":8081");
    const response = await fetch(`${control}/v9/approvals/${encodeURIComponent(approvalId)}/decision`, {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: `Bearer ${token()}` },
      body: JSON.stringify({ approved, approver_id: identity.user_id }),
    });
    const body = await response.json();
    note(response.ok ? `recorded: ${body.status}` : `refused: ${body.detail}`);
  } catch (error) { note(String(error)); }
}

document.getElementById("load").addEventListener("click", async () => {
  try {
    const identity = await whoami();
    await loadNotifications(identity.user_id);
    note("attention loaded");
  } catch (error) { note(String(error)); }
});
document.getElementById("approve").addEventListener("click", () => decide(true));
document.getElementById("deny").addEventListener("click", () => decide(false));
</script>
</body>
</html>
